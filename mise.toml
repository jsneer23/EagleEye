min_version = "2026.10.0"

[env]
EAGLEEYE_LOGS = "{{config_root}}/logs"
EAGLEEYE_CONFIG = "{{config_root}}/configs"

[tasks.setup]
description = "One-time setup after cloning"
run = "uv sync"

[tasks.checks]
description = "Run all static checks (pyright + ruff)"
depends = ["lint", "typecheck", "tests"]

[tasks.typecheck]
description = "Run pyright type checker"
env = { PYRIGHT_PYTHON_IGNORE_WARNINGS = "1" }
run = "uv run pyright"

[tasks.lint]
description = "Run ruff linter"
run = "uv run ruff check ."

[tasks.format]
description = "Run ruff formatter"
run = "uv run ruff format ."

[tasks.fix]
description = "Auto-fix ruff lint issues"
run = "uv run ruff check --fix ."

[tasks.ci-tests]
description = "Run all tests"
run = "uv run pytest --cov-report=xml"

[tasks.analyze]
description = "Run the analysis on a single match's logs"
usage = '''
flag "--event-code <event_code>" default = "2026cacac"
flag "--match-number <match_number>" default="qm1"
'''
run = 'uv run eagleeye {{ usage.event_code }} {{ usage.match_number }}'

[tasks.plot]
description = "plot check information for a given log check"
usage = '''
flag "--event-code <event_code>" default="2026cacac"
flag "--match-number <match_number>" default="qm1"
flag "--check-id <check_id>" default="brownout" {
  choices "brownout" "can_util" "radio_signal"
}
'''
run = 'uv run eagleeye {{ usage.event_code }} {{ usage.match_number }} --plot {{ usage.check_id }}'

[tasks.tests]
run = 'uv run pytest --cov-report=html  && open htmlcov/index.html'