[env]
EAGLEEYE_LOGS = "{{config_root}}/logs"

[tasks.check]
description = "Run all static checks (pyright + ruff)"
depends = ["lint", "typecheck"]

[tasks.typecheck]
description = "Run pyright type checker"
run = "uv run pyright"

[tasks.lint]
description = "Run ruff linter"
run = "uv run ruff check ."

[tasks.format]
description = "Run ruff formatter"
run = "uv run ruff format ."

[tasks.fix]
description = "Auto-fix ruff lint issues"
run = "uv run ruff check --fix ."

[tasks.review]
description = "Run the log review tool — pass LOG=path/to/file.wpilog"
run = "eagleeye ${LOG}"

[tasks.parse]
description = "Run the parser directly during dev — pass LOG=path/to/file.wpilog"
run = "uv run python -m eagleeye.log_parser ${LOG}"

[tasks.analyze]
description = "Run the analysis on a single match's logs"
run = 'uv run python -m scripts.run_checks {{arg(name="event_code", default="2026cacac")}} {{arg(name="match_number", default="qm1")}}'